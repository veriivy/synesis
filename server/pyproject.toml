[project]
name = "synesis-server"
version = "0.1.0"
description = "Rooms, SSE, git operations, and the agent write sandbox"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# auto: async tests just work, no per-test marker to forget at 3am.
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"
